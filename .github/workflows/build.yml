# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and test

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.0.x is the supported floor, and the only way to keep it honest is to build with it;
        # global.json rolls forward, so the newest installed SDK is what actually gets used.
        dotnet: [ '8.0.x', '10.0.x' ]

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet }}
    # `test` runs both test projects, src/tests and src/hermetic.tests; `pack` builds both
    # packages and fails if the Xake.Hermetic.Dotnet nuspec has no dependency on package `Xake`
    - name: Build, test & pack
      run: dotnet fsi build.fsx -- -- build test pack
    - name: Upload build log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-log-${{ github.run_number }}-${{ matrix.dotnet }}
        path: build.log
        retention-days: 5

  # The declarative self-build (build.fsc.fsx): the three libraries compiled by fsc from the
  # committed descriptions and locks, no msbuild for them; fails on a stale fingerprint
  # (`check`). The locks name the SDK's fsc.dll by path and hash, and that file is ReadyToRun
  # code for one OS and architecture: the runner matches the machine the locks were generated
  # on (macOS arm64, SDK 10.0.401). Re-run `update-locks` when either changes.
  build-fsc:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.401'
    # the script runs on this repository's libraries until a release carries what it uses
    - name: Bootstrap (build.fsx builds out/netstandard2.0)
      run: dotnet fsi build.fsx -- -- build && rm -f .xake
    - name: Build from the committed locks
      run: dotnet fsi build.fsc.fsx -- -- build check -d NUGET_FETCH=on
    - name: Upload build log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-fsc-log-${{ github.run_number }}
        path: build.log
        retention-days: 5
