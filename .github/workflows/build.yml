# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and test

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.0.x is the supported floor, and the only way to keep it honest is to build with it;
        # global.json rolls forward, so the newest installed SDK is what actually gets used.
        dotnet: [ '8.0.x', '10.0.x' ]

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet }}
    # `test` runs both test projects, src/tests and src/hermetic.tests; `pack` builds both
    # packages and fails if the Xake.Hermetic.Dotnet nuspec has no dependency on package `Xake`
    - name: Build, test & pack
      run: dotnet fsi build.fsx -- -- build test pack
    - name: Upload build log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-log-${{ github.run_number }}-${{ matrix.dotnet }}
        path: build.log
        retention-days: 5

  # The declarative self-build (build.fsc.fsx): the three libraries compiled by fsc from the
  # committed descriptions and locks, no msbuild for them; fails on a stale fingerprint
  # (`check`). The script bootstraps from the published Xake / Xake.Hermetic.Dotnet packages.
  # The locks name the SDK compiler by the SDK version (prerequisite `dotnet-sdk` 10.0.401),
  # not by a file hash: they hold for SDK 10.0.401 on any OS. Re-run `update-locks` when the
  # SDK changes. HERMETIC stays off (global.json floats; no exact SDK pin).
  build-fsc:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.401'
    - name: Build from the committed locks
      run: dotnet fsi build.fsc.fsx -- -- build check -d NUGET_FETCH=on
    - name: Upload build log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-fsc-log-${{ github.run_number }}
        path: build.log
        retention-days: 5
