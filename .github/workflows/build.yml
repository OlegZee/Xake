# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and test

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # `pinned` builds with the SDK global.json pins exactly (10.0.401, rollForward disable:
        # the F# compiler of build.fsc.fsx's lock is that SDK's fsc.dll). `floor` keeps the
        # supported minimum honest: it drops global.json and builds with SDK 8.0. Both install
        # 8.0.x as well, for the net8.0 test runtime.
        leg: [ pinned, floor ]

    steps:
    - uses: actions/checkout@v7
    - name: Drop the SDK pin (floor leg)
      if: matrix.leg == 'floor'
      run: rm global.json
    - name: Setup .NET (pinned SDK)
      if: matrix.leg == 'pinned'
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x
    - name: Setup .NET (floor)
      if: matrix.leg == 'floor'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    # `test` runs both test projects, src/tests and src/hermetic.tests; `pack` builds both
    # packages and fails if the Xake.Hermetic.Dotnet nuspec has no dependency on package `Xake`
    - name: Build, test & pack
      run: dotnet fsi build.fsx -- -- build test pack
    - name: Upload build log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-log-${{ github.run_number }}-${{ matrix.leg }}
        path: build.log
        retention-days: 5
