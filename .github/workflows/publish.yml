# Publishes one NuGet package to nuget.org, chosen by the tag (see docs/devprocess.md):
#   v<X.Y.Z>           -> Xake                  (src/dotnet, carries the engine too)
#   hermetic-v<X.Y.Z>  -> Xake.Hermetic.Dotnet  (src/hermetic; until Xake 4.0 built on the
#                                                in-repo Xake, depending on package Xake at the
#                                                VERSION of the run: refused below until then)
# The two are versioned and packed independently: a v* release runs `pack` (both packages), a
# hermetic-v* release only `pack-hermetic`; only the tagged package is pushed. Release Xake
# first when the hermetic package needs something new from it (docs/devprocess.md).
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Publish package

on:
  push:
    tags:
      - 'v*'
      - 'hermetic-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # a hang fails here instead of at the 6-hour limit (see build.yml)
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # The tag is the published version, exactly (`v3.15.0` -> 3.15.0): floors and bootstrap
    # references can be written from the tag alone. A re-run of the same tag is a no-op push
    # (--skip-duplicate); a broken release is replaced by the next patch, never re-published.
    # The prefix
    # picks the package and the build variable its version goes into (VERSION for Xake,
    # HERMETIC_VERSION for Xake.Hermetic.Dotnet) and the pack command.
    - name: Pick package and version from tag
      id: release
      run: |
        TAG_NAME="${{ github.ref_name }}"
        case "$TAG_NAME" in
          hermetic-v*)
            # until Xake 4.0 src/hermetic builds on the in-repo Xake (project references) and its
            # nupkg depends on package Xake at this run's VERSION; the next hermetic release ships
            # together with Xake 4.0 (docs/features/release-process), so a lone tag is refused
            echo "::error::hermetic-v* releases are paused until Xake 4.0 (Xake.Hermetic.Dotnet builds on the in-repo Xake)"; exit 1
            echo "package=Xake.Hermetic.Dotnet" >> $GITHUB_OUTPUT
            echo "variable=HERMETIC_VERSION" >> $GITHUB_OUTPUT
            echo "pack=pack-hermetic" >> $GITHUB_OUTPUT
            VERSION="${TAG_NAME#hermetic-v}" ;;
          v*)
            echo "package=Xake" >> $GITHUB_OUTPUT
            echo "variable=VERSION" >> $GITHUB_OUTPUT
            echo "pack=pack" >> $GITHUB_OUTPUT
            VERSION="${TAG_NAME#v}" ;;
          *)
            echo "::error::tag '$TAG_NAME' is neither v* nor hermetic-v*"; exit 1 ;;
        esac
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Build, test and pack
      run: |
        export ${{ steps.release.outputs.variable }}=${{ steps.release.outputs.version }}
        # a v* release packs both; the hermetic nupkg (at its default version, depending on Xake
        # at this VERSION) is not pushed
        dotnet fsi build.fsx -- -- build test ${{ steps.release.outputs.pack }}

    - name: Publish
      run: >
        dotnet nuget push
        out/pkg/${{ steps.release.outputs.package }}/${{ steps.release.outputs.package }}.${{ steps.release.outputs.version }}.nupkg
        --api-key ${{ secrets.NUGET_API_KEY }}
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate

    - name: Upload build log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-log-${{ github.run_number }}
        path: build.log
        retention-days: 5
