# Publishes the NuGet package `Xake` to nuget.org (see docs/devprocess.md):
#   v<X.Y.Z>           -> Xake  (src/core, the engine alone; Xake.Dotnet ships from its own
#                                repository, docs/features/dotnet-split S-D14)
#   hermetic-v<X.Y.Z>  -> refused: Xake.Hermetic.Dotnet ended at 0.10.0 (S-D2)
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Publish package

on:
  push:
    tags:
      - 'v*'
      - 'hermetic-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # a hang fails here instead of at the 6-hour limit (see build.yml)
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # The tag is the published version, exactly (`v3.15.0` -> 3.15.0): floors and bootstrap
    # references can be written from the tag alone. A re-run of the same tag is a no-op push
    # (--skip-duplicate); a broken release is replaced by the next patch, never re-published.
    # The prefix picks the package, the build variable its version goes into (VERSION) and the
    # pack command; `hermetic-v*` is refused.
    - name: Pick package and version from tag
      id: release
      run: |
        TAG_NAME="${{ github.ref_name }}"
        case "$TAG_NAME" in
          hermetic-v*)
            # Xake.Hermetic.Dotnet ended at 0.10.0; the hermetic assembly ships in the
            # Xake.Dotnet package from its own repository (docs/features/dotnet-split, S-D2)
            echo "::error::hermetic-v* releases ended at 0.10.0 (the hermetic assembly ships in Xake.Dotnet, from its own repository)"; exit 1 ;;
          v*)
            echo "package=Xake" >> $GITHUB_OUTPUT
            echo "variable=VERSION" >> $GITHUB_OUTPUT
            echo "pack=pack" >> $GITHUB_OUTPUT
            VERSION="${TAG_NAME#v}" ;;
          *)
            echo "::error::tag '$TAG_NAME' is neither v* nor hermetic-v*"; exit 1 ;;
        esac
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Build, test and pack
      run: |
        export ${{ steps.release.outputs.variable }}=${{ steps.release.outputs.version }}
        dotnet fsi build.fsx -- -- build test ${{ steps.release.outputs.pack }}

    - name: Publish
      run: >
        dotnet nuget push
        out/pkg/${{ steps.release.outputs.package }}/${{ steps.release.outputs.package }}.${{ steps.release.outputs.version }}.nupkg
        --api-key ${{ secrets.NUGET_API_KEY }}
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate

    - name: Upload build log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-log-${{ github.run_number }}
        path: build.log
        retention-days: 5
